[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coinflip-cli"
version = "0.1.0"
description = "A tiny command-line tool that flips a virtual coin."
requires-python = ">=3.8"

[project.scripts]
coinflip = "coinflip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
